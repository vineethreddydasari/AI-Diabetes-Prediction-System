<!DOCTYPE html>
<html>
<head>
    <title>AI Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🩺 AI Diabetes Prediction System</h1>

    <form action="/predict" method="POST">

        <input type="number" name="pregnancies" placeholder="Pregnancies" required>

        <input type="number" name="glucose" placeholder="Glucose Level" required>

        <input type="number" name="bp" placeholder="Blood Pressure" required>

        <input type="number" name="skin" placeholder="Skin Thickness" required>

        <input type="number" name="insulin" placeholder="Insulin" required>

        <input type="number" step="0.1" name="bmi" placeholder="BMI" required>

        <input type="number" step="0.01" name="dpf" placeholder="Diabetes Pedigree Function" required>

        <input type="number" name="age" placeholder="Age" required>

        <button type="submit">Predict</button>

    </form>

    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}

</div>

</body>
</html>
